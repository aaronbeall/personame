name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: personame
          POSTGRES_PASSWORD: personame
          POSTGRES_DB: personame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://personame:personame@localhost:5432/personame_test
      NEXTAUTH_SECRET: isolated-ci-only-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: API integration against the same production test build
        run: |
          PERSONAME_E2E=1 npm run start -- --hostname 127.0.0.1 --port 3101 > /tmp/personame-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3101/api/auth/providers > /dev/null; then break; fi
            sleep 1
          done
          PERSONAME_TEST_URL=http://127.0.0.1:3101 npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
