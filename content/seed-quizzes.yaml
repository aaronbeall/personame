# Editable starter quizzes. Validate with: npm run catalog:validate
# publication: PUBLIC publishes on first import; PRIVATE_DRAFT stays private.
# Dimensions use solids; archetypes use distinct hex themes. Scores remain 0–100.
version: 1
quizzes:
  - slug: weekend-wanderer
    title: What kind of weekend wanderer are you?
    description: A tiny adventure, a scenic detour, or a very good nap. Find your preferred way to get
      away. For fun and reflection; not a validated assessment.
    emoji: 🧭
    dimensions:
      - key: novelty
        name: Adventure
        minLabel: Familiar
        maxLabel: Adventurous
        description: Your appetite for new places and unexpected detours.
        emoji: 🧭
        minEmoji: 🏡
        maxEmoji: 🥾
        color: "#14b8a6"
        displayScale: PERCENT_ASCENDING
      - key: company
        name: Company
        minLabel: Solitary
        maxLabel: Sociable
        description: How much company you enjoy on your days off.
        emoji: 👥
        minEmoji: 🧘
        maxEmoji: 🎉
        color: "#06b6d4"
        displayScale: PERCENT_ASCENDING
    archetypes:
      - name: The Hideaway
        description: A familiar corner, a quiet morning, and nobody asking for the itinerary.
        emoji: 🌿
        targets:
          novelty: 15
          company: 15
        color: "#475569,#a5b4fc"
        relevance:
          novelty: 1
          company: 0.8
      - name: The Trailblazer
        description: You follow your curiosity, even when nobody else can find the path.
        emoji: 🥾
        targets:
          novelty: 85
          company: 15
        color: "#be185d,#fb7185"
        relevance:
          novelty: 0.8
          company: 1
      - name: The Reunion Planner
        description: The best destination is wherever your favorite people gather.
        emoji: 🧺
        targets:
          novelty: 15
          company: 85
        color: "#166534,#84cc16"
        relevance:
          novelty: 1
          company: 0.8
      - name: The Detour Captain
        description: You bring the crew and turn a wrong turn into the main attraction.
        emoji: 🚐
        targets:
          novelty: 85
          company: 85
        color: "#c2410c,#a855f7"
        relevance:
          novelty: 0.8
          company: 1
    questions:
      - type: MULTIPLE_CHOICE
        text: The weekend suddenly opens up. Your first thought?
        answers:
          - text: Return to my favorite spot.
            weights:
              novelty: -12
            emoji: 🏡
          - text: See what sounds good tomorrow.
            weights:
              novelty: 0
            emoji: ⚖️
          - text: Pick somewhere I have never been.
            weights:
              novelty: 12
            emoji: 🥾
        emoji: 🧭
      - type: MULTIPLE_CHOICE
        text: You spot an unmarked path beside the main trail.
        answers:
          - text: Stay with the route I know.
            weights:
              novelty: -12
            emoji: 🏡
          - text: Look it up before deciding.
            weights:
              novelty: 0
            emoji: ⚖️
          - text: Let us see where it goes.
            weights:
              novelty: 12
            emoji: 🥾
        emoji: 🧭
      - type: MULTIPLE_CHOICE
        text: Who gets an invitation?
        answers:
          - text: Nobody; this one is for me.
            weights:
              company: -12
            emoji: 🧘
          - text: One or two easygoing companions.
            weights:
              company: 0
            emoji: ⚖️
          - text: The group chat is already buzzing.
            weights:
              company: 12
            emoji: 🎉
        emoji: 👥
      - type: MULTIPLE_CHOICE
        text: The ideal evening ends with…
        answers:
          - text: A book and my own thoughts.
            weights:
              company: -12
            emoji: 🧘
          - text: A conversation with a close friend.
            weights:
              company: 0
            emoji: ⚖️
          - text: A table full of stories.
            weights:
              company: 12
            emoji: 🎉
        emoji: 👥
      - type: SLIDER
        text: How far from your usual routine would you like to go?
        answers:
          - text: Keep it familiar
            weights:
              novelty: -16
            emoji: 🏡
          - text: Surprise me
            weights:
              novelty: 16
            emoji: 🥾
        emoji: 🧭
      - type: SCALE
        text: How much company makes a getaway better?
        answers:
          - text: Solo sanctuary
            weights:
              company: -16
          - text: The whole crew
            weights:
              company: 16
          - text: Just me
            weights: {}
          - text: A little
            weights: {}
          - text: A mix
            weights: {}
          - text: A lively group
            weights: {}
          - text: Everyone
            weights: {}
        emoji: 👥
    color: "#2563eb,#7c3aed"
    publication: PUBLIC
